<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- ears -->
  <path d="M8 30 L10 4 L28 17 Z" fill="#f29a4a" stroke="#8a4a1f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M56 30 L54 4 L36 17 Z" fill="#f29a4a" stroke="#8a4a1f" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M13 22 L14 11 L22 17 Z" fill="#ffb3c1"/>
  <path d="M51 22 L50 11 L42 17 Z" fill="#ffb3c1"/>
  <!-- head -->
