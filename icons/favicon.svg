  <path d="M32 45.5 q-2.5 4 -6 2 M32 45.5 q2.5 4 6 2" fill="none" stroke="#3a2a20" stroke-width="1.8" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="13.5" cy="44" rx="4" ry="2.6" fill="#ff9aae" opacity=".7"/>
  <ellipse cx="50.5" cy="44" rx="4" ry="2.6" fill="#ff9aae" opacity=".7"/>
