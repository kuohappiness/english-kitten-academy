<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff4e8"><title>喵喵英文拼句學院 · Unit 05</title>
<style>
:root{font-family:ui-rounded,'Noto Sans TC','PingFang TC',system-ui,sans-serif;color:#374151;background:#fff7ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 12%,#ffe5d2 0 9%,transparent 26%),radial-gradient(circle at 95% 80%,#dff4ef 0 7%,transparent 29%),#fff7ef}button,select{font:inherit}button{cursor:pointer}.wrap{max-width:1080px;margin:auto;padding:22px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900;color:#805746}.logo{background:white;border-radius:22px;box-shadow:0 6px 0 #f1d3bb;padding:11px;font-size:28px}.chip{background:#fff;border:2px solid #f5dbca;padding:9px 14px;border-radius:50px;color:#906651;font-weight:800}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 18px}.hero h1{font-size:clamp(25px,5vw,38px);margin:4px 0;color:#63493f}.hero p{margin:6px 0;color:#8b746a}.cat{font-size:80px;display:inline-block;filter:drop-shadow(0 8px 1px #edcead);transform-origin:bottom center}.cat.bounce{animation:hop .55s ease-in-out 3}.cat.party{animation:party .75s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-27px) rotate(9deg)}}@keyframes party{0%,100%{transform:translateY(0) rotate(-12deg) scale(1)}50%{transform:translateY(-24px) rotate(12deg) scale(1.13)}}.tabs{display:flex;gap:9px;overflow-x:auto;padding:5px 2px 12px}.tab{white-space:nowrap;border:none;padding:12px 17px;border-radius:16px;background:#fff;color:#82645a;font-weight:900;box-shadow:0 4px 0 #ead7c6}.tab.active{background:#ffb782;color:#633d24;box-shadow:0 4px 0 #d98c58}.panel{background:white;border:2px solid #f3e3d6;border-radius:28px;box-shadow:0 12px 30px #765c4512;padding:clamp(18px,4vw,34px)}.statline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.tiny{font-size:13px;color:#987e6d;font-weight:800}.progress{height:13px;border-radius:20px;background:#f5ece4;overflow:hidden;margin:14px 0 22px}.progress div{height:100%;width:0;background:linear-gradient(90deg,#85d9ae,#54c7b0);transition:width .3s}.prompt{background:#fdf6e8;border:2px dashed #efdcb6;border-radius:19px;padding:20px;margin-bottom:16px}.prompt small{color:#a48b6d;font-weight:800}.prompt h2{font-size:clamp(19px,4vw,26px);line-height:1.7;margin:6px 0 0;color:#644f40}.prompt p{margin:4px 0 0;color:#b07b53;font-size:14px}.sectionlabel{font-weight:900;color:#81675b;margin:14px 0 9px}.zone{min-height:103px;background:#f2faf7;border:2px dashed #afd8cb;border-radius:18px;padding:14px;display:flex;align-items:center;align-content:center;flex-wrap:wrap;gap:9px;transition:background .2s}.zone.over{background:#d6f5eb;border-color:#4eba9b}.zone.empty:before{content:'把單字拖到這裡，或點選下方單字';color:#8fac9f;font-size:14px}.bank{min-height:85px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tile{touch-action:pan-y;user-select:none;-webkit-user-select:none;border:2px solid #e2c7aa;border-bottom:4px solid #d6a97b;border-radius:12px;background:#fff9e9;color:#6b4f38;padding:11px 14px;font-size:clamp(15px,2.5vw,19px);font-weight:900;box-shadow:0 3px 7px #9a755015;transition:transform .12s}.tile:hover{transform:translateY(-2px)}.tile:focus-visible{outline:3px solid #60c5b2}.tile.placed{background:#fff;border-color:#afdacf;border-bottom-color:#77bbad}.tile.bad{color:#c52d40;border-color:#ff8d95;background:#fff0f0}.tile.dragged{opacity:.4}.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:13px 23px;font-weight:900;box-shadow:0 4px 0 #d6bea7}.primary{background:#ffab75;color:#543b2e;box-shadow:0 4px 0 #de8c53}.secondary{background:#f4efe9;color:#756254}.mint{background:#b6e9d4;color:#2f6553;box-shadow:0 4px 0 #81bfa6}.btn:disabled{opacity:.4;cursor:not-allowed}.feedback{margin-top:18px;padding:17px;border-radius:17px;background:#fff7e5;border:1px solid #f3daab}.feedback.good{background:#ecfff1;border-color:#b0e8c0}.feedback h3{margin:0 0 9px;font-size:20px}.answer{font-size:18px;line-height:2.1;font-weight:800;word-spacing:3px}.answer .bad{color:#d62c45;background:#ffe5e9;padding:3px 4px;border-radius:6px}.muted{color:#8d7567;font-size:14px}.footnote{font-size:13px;color:#a68b78;text-align:center;margin-top:20px}.hidden{display:none!important}.review{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.checkmark{background:#e5f8ed;color:#358363;border-radius:30px;padding:5px 12px;font-size:13px;font-weight:900}.sparkle{position:fixed;pointer-events:none;z-index:9;font-size:27px;animation:fall 1.5s ease forwards}@keyframes fall{to{transform:translate(var(--dx),120px) rotate(360deg);opacity:0}}.lesson-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #f2e9df;padding:14px 0}.lesson-row:last-child{border:none}.lesson-row strong{color:#685044}.lesson-row small{color:#9d8472}.homecard{padding:22px;border-radius:22px;background:#fcf5e8;margin:15px 0}.homecard h2{margin:0 0 9px}.select{padding:10px;border:2px solid #f1d7c0;border-radius:12px;background:white;color:#674e40;max-width:100%}@media(max-width:550px){.hero .cat{font-size:60px}.brand{font-size:18px}.panel{border-radius:20px}.btn{flex:1}.tile{padding:10px 11px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><span class="logo">🐾</span><span>喵喵英文拼句學院</span></div><span class="chip">📗 Unit 05 · 課本 p.38–39</span></header><section class="hero"><div><div class="tiny">ENGLISH WORD PUZZLE</div><h1>一句一句，拼出英文力！</h1><p>把單字排成句子，小貓陪你一起練習 ✨</p></div><div id="cat" class="cat" aria-label="可愛的小貓">🐱</div></section><nav id="tabs" class="tabs" aria-label="單元選擇"></nav><section class="panel" id="app"></section><p class="footnote">學習進度只儲存在這台裝置的瀏覽器 · 離線也能練習 · 可擴充更多單元 🐈</p></main>
<script>
// 新增課程：在 LESSONS 加入 {id,title,items:[{en,zh},...]}，網站會自動建立新分頁。
const LESSONS=[
{id:'for',title:'① for / because',items:[
['Lucas wrote a song for his wife.','盧卡斯寫了一首歌給他太太。'],
['Those people are fighting for their freedom.','那些人是為了他們的自由而戰。'],
['For some reason, Nora decided not to study abroad.','基於某些原因，諾拉決定不出國念書。'],
['Are you for or against the proposal?','你是贊成或反對本提案？'],
['Jerry decided to stop for lunch first, for he was feeling hungry.','傑瑞決定先停下來吃午餐，因為他肚子餓了。'],
['I like Jeremy because he is polite.','我喜歡傑瑞米，因為他很有禮貌。'],
['Because Jeremy is polite, I like him.','因為傑瑞米很有禮貌，所以我喜歡他。'],
['Because of COVID-19, we couldn’t travel abroad.','由於新冠肺炎，我們無法出國旅行。']]},
{id:'will',title:'② will',items:[
['I will arrive in New York tomorrow morning.','明早我將會抵達紐約。'],
['I’ll arrive in New York tomorrow morning.','明早我將會抵達紐約。（縮寫句）'],
['Nobody can question Stanley’s will to win.','沒有人可以質疑史坦利的求勝意志。'],
['You can’t just ignore the rules at will.','你不能隨意忽略這些規定。'],
['The man made his final will a month before he died.','這名男子在去世前一個月立下最後的遺囑。']]},
{id:'can',title:'③ can',items:[
['Can you speak French?','你會說法文嗎？'],
['You can’t talk loudly in the library.','在圖書館內不能大聲喧嘩。'],
['You cannot talk loudly in the library.','在圖書館內不能大聲喧嘩。（完整形式）'],
['Matthew drank ten cans of soda at the party.','馬修在派對上喝了十罐汽水。'],
['My mother always cans fruit at the end of the summer.','每年夏末，我母親總是把水果製成罐頭。']]},
{id:'time',title:'④ time',items:[
['Time passes quickly when you’re having fun.','玩樂時，時間過得特別快。'],
['Nate goes to the gym three times a week.','奈特一週上健身房三次。'],
['John didn’t have time to prepare for the test.','約翰沒有時間來準備考試。'],
['Take your time with the meal; there’s no rush.','你可以慢慢用餐，不用急。'],
['I’m afraid that you have to share your room for the time being.','恐怕你得暫時跟別人合住一間房。'],
['Luke finished the job in no time and left.','路克很快地把工作做完就離開了。'],
['The train arrived at the station on time.','火車準時到站。'],
['Will you be here in time for the concert?','你來得及趕來聽這場演唱會嗎？'],
['My parents come to Taipei to see me from time to time.','我父母偶爾會來臺北看我。'],
['Tom timed his visit to suit Judy’s convenience.','湯姆選在茱蒂方便的時候去拜訪她。']]},
{id:'take',title:'⑤ take',items:[
['Do you know who took my book?','你知道誰拿走我的書嗎？'],
['Eric took his children to the amusement park.','艾瑞克帶他的小孩到遊樂園。'],
['Grace takes a bus to work every day.','葛瑞絲每天搭公車去上班。'],
['It took me five hours to finish the book.','我花了五個小時看完那本書。']]}];
const KEY='kitten-english-u05-v1';let records={};try{records=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){};
let lesson='for',index=0,bank=[],placed=[],status='',attempts=0,forceRepeat=false;
const $=id=>document.getElementById(id);const current=()=>LESSONS.find(x=>x.id===lesson);const words=s=>s.split(/\s+/).filter(Boolean);const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(records))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key=()=>lesson+':'+index;const rec=()=>records[key()]||{try:0,pass:0,mistakes:0};
function scramble(tokens){let ids=tokens.map((_,i)=>i);for(let n=0;n<12;n++){for(let i=ids.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[ids[i],ids[j]]=[ids[j],ids[i]]}}if(ids.every((v,i)=>v===i)&&ids.length>1)[ids[0],ids[1]]=[ids[1],ids[0]];return ids}
function setup(){const all=words(current().items[index][0]);bank=scramble(all);placed=[];status='';attempts=0;draw()}
function tabs(){ $('tabs').innerHTML=LESSONS.map(l=>`<button class="tab ${lesson===l.id?'active':''}" data-lesson="${l.id}">${esc(l.title)}</button>`).join('')+`<button class="tab" data-lesson="future">＋ 未來單元</button>`;document.querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{if(b.dataset.lesson==='future'){future();return}lesson=b.dataset.lesson;index=0;setup()})}
function future(){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));$('app').innerHTML=`<div class="homecard"><h2>📚 更多單元，準備中！</h2><p>網站已預留題庫架構，未來可以加入 Unit 06、Unit 07 或其他英文教材的句子。</p><p class="muted">新增課程只需要新增句子和中文翻譯，不需修改遊戲核心。</p><button class="btn primary" id="back">回到 Unit 05</button></div>`;$('back').onclick=()=>{tabs();setup()}}
function tile(id,zone){const str=words(current().items[index][0])[id];return `<button class="tile ${zone?'placed':''} ${status==='wrong'&&zone&&id!==placed.indexOf(id)?'':''}" draggable="true" data-id="${id}" data-zone="${zone?'placed':'bank'}" title="${zone?'點選移回單字區':'點選加入句子'}">${esc(str)}</button>`}
function draw(){tabs();const l=current(), item=l.items[index], r=rec(),done=l.items.filter((_,i)=>(records[l.id+':'+i]?.pass||0)>0).length;let bankHtml=bank.filter(id=>!placed.includes(id)).map(i=>tile(i,false)).join(''),placedHtml=placed.map(i=>tile(i,true)).join('');$('app').innerHTML=`<div class="statline"><span class="tiny">📖 ${esc(l.title)}　｜　第 ${index+1} / ${l.items.length} 題</span><span class="tiny">✅ 已答對 ${done} / ${l.items.length}　｜　此題練習 ${r.try} 次</span></div><div class="progress"><div style="width:${done/l.items.length*100}%"></div></div><div class="prompt"><small>讀中文，拼出課本的英文句子</small><h2>${esc(item[1])}</h2><p>💡 按照原文排序；逗號、句號已附在單字磚塊上</p></div><div class="sectionlabel">✏️ 我的句子 <span class="muted">（點選磚塊可移回）</span></div><div id="answer-zone" class="zone ${placed.length?'':'empty'}" aria-label="拼句區">${placedHtml}</div><div class="sectionlabel">🧩 單字磚塊 <span class="muted">（點選或拖曳）</span></div><div id="bank-zone" class="bank" aria-label="可用單字">${bankHtml}</div><div class="actions"><button id="check" class="btn primary" ${status||placed.length!==bank.length?'disabled':''}>✅ 檢查答案</button><button id="reset" class="btn secondary">🔀 重新排列</button><button id="skip" class="btn secondary">下一題 →</button></div><div id="feedback"></div><div class="review"><span class="checkmark">🌟 答對可累積進度</span><span class="muted">答錯的題目會優先安排複習</span></div>`;
$('check').onclick=check;$('reset').onclick=()=>{const s=words(current().items[index][0]);bank=scramble(s);placed=[];status='';draw()};$('skip').onclick=next;
for(const t of document.querySelectorAll('.tile')){t.onclick=()=>{if(status)return;let id=+t.dataset.id;if(placed.includes(id))placed=placed.filter(v=>v!==id);else placed.push(id);draw()};t.addEventListener('dragstart',ev=>{if(status){ev.preventDefault();return}ev.dataTransfer.setData('text/plain',String(t.dataset.id));ev.dataTransfer.effectAllowed='move'});}
for(const z of [$('answer-zone'),$('bank-zone')]){z.ondragover=e=>{if(status)return;e.preventDefault();z.classList.add('over')};z.ondragleave=()=>z.classList.remove('over');z.ondrop=e=>{e.preventDefault();z.classList.remove('over');if(status)return;const id=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(id)||id<0||id>=bank.length)return;if(z.id==='bank-zone')placed=placed.filter(x=>x!==id);else{placed=placed.filter(x=>x!==id);const target=e.target.closest('.tile');const pos=target?placed.indexOf(+target.dataset.id):-1;if(pos<0)placed.push(id);else placed.splice(pos,0,id)}draw()}}
// 觸控裝置可直接點選單字；桌面可拖曳放置及調整順序。
if(status)feedback();}
function check(){if(placed.length!==bank.length||status)return;let right=placed.every((id,i)=>id===i),r=rec();r.try++;if(right)r.pass++;else r.mistakes++;records[key()]=r;save();status=right?'right':'wrong';draw();if(right)celebrate()}
function feedback(){const all=words(current().items[index][0]);const wrong=placed.map((id,i)=>id!==i);const score=wrong.filter(v=>!v).length;let html=status==='right'?`<div class="feedback good"><h3>🐱🎉 喵～太厲害了！全部正確！</h3><div class="answer">${all.map(esc).join(' ')}</div><p class="muted">小貓為你歡呼！可以繼續下一題囉。</p><button id="next-after" class="btn mint">下一題，繼續挑戰 →</button></div>`:`<div class="feedback"><h3>🐾 很接近了！你排對 ${score} / ${all.length} 個位置</h3><p>看看正確句子，<strong style="color:#d62c45">紅色</strong>是這次需要修正的位置：</p><div class="answer">${all.map((w,i)=>`<span class="${wrong[i]?'bad':''}">${esc(w)}</span>`).join(' ')}</div><p class="muted">讀一遍正確句子，再試一次，記得語序喔！</p><button id="repeat" class="btn primary">🔁 重新打亂，再練一次</button></div>`;$('feedback').innerHTML=html;if(status==='right')$('next-after').onclick=next;else $('repeat').onclick=()=>{bank=scramble(all);placed=[];status='';draw()}}
function next(){const l=current();let pending=l.items.map((_,i)=>i).filter(i=>i!==index&&(records[l.id+':'+i]?.mistakes||0)>(records[l.id+':'+i]?.pass||0));if(pending.length&&Math.random()<.5)index=pending[Math.floor(Math.random()*pending.length)];else index=(index+1)%l.items.length;setup()}
function celebrate(){$('cat').classList.add('party');setTimeout(()=>$('cat')?.classList.remove('party'),2500);for(let i=0;i<18;i++){let s=document.createElement('span');s.className='sparkle';s.textContent=['🌟','💗','✨','🐾','🎉'][i%5];s.style.left=(20+Math.random()*60)+'vw';s.style.top=(14+Math.random()*34)+'vh';s.style.setProperty('--dx',(Math.random()*200-100)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}
setup();
</script></body></html>
