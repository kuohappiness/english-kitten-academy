<style>
:root{font-family:ui-rounded,'Noto Sans TC','PingFang TC',system-ui,sans-serif;color:#374151;background:#fff7ef}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 8% 12%,#ffe5d2 0 9%,transparent 26%),radial-gradient(circle at 95% 80%,#dff4ef 0 7%,transparent 29%),#fff7ef}button,select{font:inherit}button{cursor:pointer}.wrap{max-width:1080px;margin:auto;padding:22px 18px 70px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:900;color:#805746}.logo{background:white;border-radius:22px;box-shadow:0 6px 0 #f1d3bb;padding:11px;font-size:28px}.chip{background:#fff;border:2px solid #f5dbca;padding:9px 14px;border-radius:50px;color:#906651;font-weight:800}.hero{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:30px 0 18px}.hero h1{font-size:clamp(25px,5vw,38px);margin:4px 0;color:#63493f}.hero p{margin:6px 0;color:#8b746a}.cat{font-size:80px;display:inline-block;filter:drop-shadow(0 8px 1px #edcead);transform-origin:bottom center}.cat.bounce{animation:hop .55s ease-in-out 3}.cat.party{animation:party .75s ease-in-out infinite}@keyframes hop{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-27px) rotate(9deg)}}@keyframes party{0%,100%{transform:translateY(0) rotate(-12deg) scale(1)}50%{transform:translateY(-24px) rotate(12deg) scale(1.13)}}.tabs{display:flex;gap:9px;overflow-x:auto;padding:5px 2px 12px}.tab{white-space:nowrap;border:none;padding:12px 17px;border-radius:16px;background:#fff;color:#82645a;font-weight:900;box-shadow:0 4px 0 #ead7c6}.tab.active{background:#ffb782;color:#633d24;box-shadow:0 4px 0 #d98c58}.panel{background:white;border:2px solid #f3e3d6;border-radius:28px;box-shadow:0 12px 30px #765c4512;padding:clamp(18px,4vw,34px)}.statline{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}.tiny{font-size:13px;color:#987e6d;font-weight:800}.progress{height:13px;border-radius:20px;background:#f5ece4;overflow:hidden;margin:14px 0 22px}.progress div{height:100%;width:0;background:linear-gradient(90deg,#85d9ae,#54c7b0);transition:width .3s}.prompt{background:#fdf6e8;border:2px dashed #efdcb6;border-radius:19px;padding:20px;margin-bottom:16px}.prompt small{color:#a48b6d;font-weight:800}.prompt h2{font-size:clamp(19px,4vw,26px);line-height:1.7;margin:6px 0 0;color:#644f40}.prompt p{margin:4px 0 0;color:#b07b53;font-size:14px}.sectionlabel{font-weight:900;color:#81675b;margin:14px 0 9px}.zone{min-height:103px;background:#f2faf7;border:2px dashed #afd8cb;border-radius:18px;padding:14px;display:flex;align-items:center;align-content:center;flex-wrap:wrap;gap:9px;transition:background .2s}.zone.over{background:#d6f5eb;border-color:#4eba9b}.zone.empty:before{content:'把單字拖到這裡，或點選下方單字';color:#8fac9f;font-size:14px}.bank{min-height:85px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}.tile{touch-action:pan-y;user-select:none;-webkit-user-select:none;border:2px solid #e2c7aa;border-bottom:4px solid #d6a97b;border-radius:12px;background:#fff9e9;color:#6b4f38;padding:11px 14px;font-size:clamp(15px,2.5vw,19px);font-weight:900;box-shadow:0 3px 7px #9a755015;transition:transform .12s}.tile:hover{transform:translateY(-2px)}.tile:focus-visible{outline:3px solid #60c5b2}.tile.placed{background:#fff;border-color:#afdacf;border-bottom-color:#77bbad}.tile.bad{color:#c52d40;border-color:#ff8d95;background:#fff0f0}.tile.dragged{opacity:.4}.actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}.btn{border:0;border-radius:16px;padding:13px 23px;font-weight:900;box-shadow:0 4px 0 #d6bea7}.primary{background:#ffab75;color:#543b2e;box-shadow:0 4px 0 #de8c53}.secondary{background:#f4efe9;color:#756254}.mint{background:#b6e9d4;color:#2f6553;box-shadow:0 4px 0 #81bfa6}.btn:disabled{opacity:.4;cursor:not-allowed}.feedback{margin-top:18px;padding:17px;border-radius:17px;background:#fff7e5;border:1px solid #f3daab}.feedback.good{background:#ecfff1;border-color:#b0e8c0}.feedback h3{margin:0 0 9px;font-size:20px}.answer{font-size:18px;line-height:2.1;font-weight:800;word-spacing:3px}.answer .bad{color:#d62c45;background:#ffe5e9;padding:3px 4px;border-radius:6px}.muted{color:#8d7567;font-size:14px}.footnote{font-size:13px;color:#a68b78;text-align:center;margin-top:20px}.hidden{display:none!important}.review{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.checkmark{background:#e5f8ed;color:#358363;border-radius:30px;padding:5px 12px;font-size:13px;font-weight:900}.sparkle{position:fixed;pointer-events:none;z-index:9;font-size:27px;animation:fall 1.5s ease forwards}@keyframes fall{to{transform:translate(var(--dx),120px) rotate(360deg);opacity:0}}.lesson-row{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #f2e9df;padding:14px 0}.lesson-row:last-child{border:none}.lesson-row strong{color:#685044}.lesson-row small{color:#9d8472}.homecard{padding:22px;border-radius:22px;background:#fcf5e8;margin:15px 0}.homecard h2{margin:0 0 9px}.select{padding:10px;border:2px solid #f1d7c0;border-radius:12px;background:white;color:#674e40;max-width:100%}@media(max-width:550px){.hero .cat{font-size:60px}.brand{font-size:18px}.panel{border-radius:20px}.btn{flex:1}.tile{padding:10px 11px}}

.login-grid{display:grid;gap:13px;max-width:440px;margin:18px auto}.input{width:100%;padding:14px;border:2px solid #f1d7c0;border-radius:14px;font-size:17px}.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:18px 0}.scorebox{background:#fdf6e8;border-radius:17px;padding:14px;text-align:center}.scorebox b{font-size:27px;color:#c76f39}.scorebox small{display:block;color:#926f5f}.lesson-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff8ec;border:2px solid #f1dfcd;border-radius:18px;padding:15px;margin:12px 0}.lesson-card strong{display:block;color:#755341}.lesson-card small{color:#9b7e66}.completion{text-align:center;padding:30px 8px}.completion-cat{font-size:90px;animation:party .8s ease-in-out infinite}.leader-note{font-size:13px;color:#926f5f;padding:12px;background:#fff7e9;border-radius:12px}.switch{background:none;border:0;color:#94735c;text-decoration:underline}.ranking{width:100%;border-collapse:collapse}.ranking td,.ranking th{padding:11px;border-bottom:1px solid #f5e6d7;text-align:left}.nextcard{background:#effcf5;padding:14px;border-radius:16px;margin:18px 0}.smallnote{font-size:13px;color:#8b766b}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><span class="logo">🐾</span><span>喵喵英文拼句學院</span></div><span class="chip">📗 Unit 05 · 課本 p.38–39</span></header><section class="hero"><div><div class="tiny">ENGLISH WORD PUZZLE</div><h1>一句一句，拼出英文力！</h1><p>把單字排成句子，小貓陪你一起練習 ✨</p></div><div id="cat" class="cat" aria-label="可愛的小貓">🐱</div></section><nav id="tabs" class="tabs" aria-label="單元選擇"></nav><section class="panel" id="app"></section><p class="footnote">學習進度只儲存在這台裝置的瀏覽器 · 離線也能練習 · 可擴充更多單元 🐈</p></main>
<script>
// 新增課程：在 LESSONS 加入 {id,title,items:[{en,zh},...]}，網站會自動建立新分頁。
const LESSONS=[
{id:'for',title:'① for / because',items:[
['Lucas wrote a song for his wife.','盧卡斯寫了一首歌給他太太。'],
['Those people are fighting for their freedom.','那些人是為了他們的自由而戰。'],
['For some reason, Nora decided not to study abroad.','基於某些原因，諾拉決定不出國念書。'],
['Are you for or against the proposal?','你是贊成或反對本提案？'],
['Jerry decided to stop for lunch first, for he was feeling hungry.','傑瑞決定先停下來吃午餐，因為他肚子餓了。'],
['I like Jeremy because he is polite.','我喜歡傑瑞米，因為他很有禮貌。'],
['Because Jeremy is polite, I like him.','因為傑瑞米很有禮貌，所以我喜歡他。'],
['Because of COVID-19, we couldn’t travel abroad.','由於新冠肺炎，我們無法出國旅行。']]},
{id:'will',title:'② will',items:[
['I will arrive in New York tomorrow morning.','明早我將會抵達紐約。'],
['I’ll arrive in New York tomorrow morning.','明早我將會抵達紐約。（縮寫句）'],
['Nobody can question Stanley’s will to win.','沒有人可以質疑史坦利的求勝意志。'],
['You can’t just ignore the rules at will.','你不能隨意忽略這些規定。'],
['The man made his final will a month before he died.','這名男子在去世前一個月立下最後的遺囑。']]},
{id:'can',title:'③ can',items:[
['Can you speak French?','你會說法文嗎？'],
['You can’t talk loudly in the library.','在圖書館內不能大聲喧嘩。'],
['You cannot talk loudly in the library.','在圖書館內不能大聲喧嘩。（完整形式）'],
['Matthew drank ten cans of soda at the party.','馬修在派對上喝了十罐汽水。'],
['My mother always cans fruit at the end of the summer.','每年夏末，我母親總是把水果製成罐頭。']]},
{id:'time',title:'④ time',items:[
['Time passes quickly when you’re having fun.','玩樂時，時間過得特別快。'],
['Nate goes to the gym three times a week.','奈特一週上健身房三次。'],
['John didn’t have time to prepare for the test.','約翰沒有時間來準備考試。'],
['Take your time with the meal; there’s no rush.','你可以慢慢用餐，不用急。'],
['I’m afraid that you have to share your room for the time being.','恐怕你得暫時跟別人合住一間房。'],
['Luke finished the job in no time and left.','路克很快地把工作做完就離開了。'],
['The train arrived at the station on time.','火車準時到站。'],
['Will you be here in time for the concert?','你來得及趕來聽這場演唱會嗎？'],
['My parents come to Taipei to see me from time to time.','我父母偶爾會來臺北看我。'],
['Tom timed his visit to suit Judy’s convenience.','湯姆選在茱蒂方便的時候去拜訪她。']]},
{id:'take',title:'⑤ take',items:[
['Do you know who took my book?','你知道誰拿走我的書嗎？'],
['Eric took his children to the amusement park.','艾瑞克帶他的小孩到遊樂園。'],
['Grace takes a bus to work every day.','葛瑞絲每天搭公車去上班。'],
['It took me five hours to finish the book.','我花了五個小時看完那本書。']]}];
const KEY='kitten-academy-local-v2';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tokens=s=>s.trim().split(/\s+/);
let db={users:{},active:null};try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');if(d&&d.users)db=d}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
let lesson=null,index=0,bank=[],placed=[],status='',stage='home',round=[],feedbackInfo=null;
const me=()=>db.users[db.active];
const topic=()=>LESSONS.find(l=>l.id===lesson);
const rec=(lid,i)=>{let u=me();u.progress??={};u.progress[lid]??={};u.progress[lid][i]??={attempts:0,correct:false,points:0,wrong:false};return u.progress[lid][i]};
const stats=lid=>{let l=LESSONS.find(x=>x.id===lid),u=me();let records=(u?.progress||{})[lid]||{};return {done:l.items.filter((_,i)=>records[i]?.correct).length,total:l.items.length,points:Object.values(records).reduce((n,r)=>n+(r.points||0),0),complete:l.items.every((_,i)=>records[i]?.correct)};};
const total=()=>Object.values(me().progress||{}).flatMap(x=>Object.values(x)).reduce((a,r)=>a+(r.points||0),0)+Object.keys(me().bonuses||{}).length*5;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.length>1&&a.every((x,i)=>x===i))[a[0],a[1]]=[a[1],a[0]];return a}
function party(){let c=$('cat');c.classList.add('party');setTimeout(()=>c?.classList.remove('party'),2200);for(let i=0;i<23;i++){let s=document.createElement('span');s.className='sparkle';s.textContent=['🌟','💗','✨','🐾','🎉'][i%5];s.style.left=(15+Math.random()*70)+'vw';s.style.top=(15+Math.random()*40)+'vh';s.style.setProperty('--dx',(Math.random()*240-120)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}
function header(){let nav=$('tabs');nav.innerHTML=db.active?`<button class="tab ${stage==='home'?'active':''}" data-page="home">🏠 學習首頁</button><button class="tab ${stage==='ranking'?'active':''}" data-page="ranking">🏆 排行榜</button><button class="tab" data-page="logout">👋 切換學員</button>`:'';nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.page==='logout'){db.active=null;save();stage='home';home()}else if(b.dataset.page==='ranking')ranking();else home()});}
function home(){stage='home';header();if(!me()){$('app').innerHTML=`<div class="homecard" style="text-align:center"><h2>🐱 歡迎來到喵喵英文學院！</h2><p>先輸入學員暱稱，就可以開始練習與累積星星。</p></div><div class="login-grid"><label>學員暱稱<input id="nickname" class="input" maxlength="20" autocomplete="nickname" placeholder="例如：小喵、Amy"></label><button class="btn primary" id="enter">🐾 開始學習</button><div class="leader-note">目前是單機體驗版：使用暱稱建立這台手機上的學習檔案，<strong>不是雲端帳號或密碼登入</strong>。跨裝置帳號與朋友排行榜需連接安全資料庫，請勿在此輸入密碼。</div></div>`;$('enter').onclick=()=>{let n=$('nickname').value.trim();if(!n){alert('先輸入暱稱喔！');return}if(!db.users[n])db.users[n]={progress:{},bonuses:{}};db.active=n;save();home()};return}
let completed=LESSONS.filter(l=>stats(l.id).complete).length;
$('app').innerHTML=`<h2>🐾 ${esc(db.active)}，歡迎回來！</h2><div class="scoreboard"><div class="scorebox"><b>⭐ ${total()}</b><small>累積積分</small></div><div class="scorebox"><b>${completed} / ${LESSONS.length}</b><small>完成單字</small></div></div><p class="smallnote">第一次答對 3 分、第二次答對 2 分、第三次以後答對 1 分；每個句子只計分一次。完成一整個單字再加 5 分。</p>${LESSONS.map(l=>{let st=stats(l.id);return `<div class="lesson-card"><div><strong>${esc(l.title)}</strong><small>✅ ${st.done}/${st.total} 句 · ⭐ ${st.points} 分${st.complete?' · 已過關 🏅':''}</small></div><button class="btn ${st.complete?'secondary':'primary'}" data-start="${l.id}">${st.complete?'再次複習':'開始練習 →'}</button></div>`}).join('')}<div class="leader-note">🏆 想跟不同手機上的朋友比較排名？目前仍需啟用雲端帳號和資料庫，這個版本不會顯示虛構的朋友排名。</div>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));}
function ranking(){stage='ranking';header();let people=Object.entries(db.users).map(([name,u])=>({name,score:Object.values(u.progress||{}).flatMap(x=>Object.values(x)).reduce((a,r)=>a+(r.points||0),0)+Object.keys(u.bonuses||{}).length*5})).sort((a,b)=>b.score-a.score).slice(0,10);$('app').innerHTML=`<h2>🏆 本裝置積分榜</h2><p class="leader-note">這裡只會列出<strong>同一瀏覽器中建立的學員</strong>，不是網路朋友的即時排行榜。雲端前十名功能尚待串接。</p><table class="ranking"><tr><th>排名</th><th>暱稱</th><th>積分</th></tr>${people.map((u,i)=>`<tr><td>${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)}</td><td>${esc(u.name)}</td><td>⭐ ${u.score}</td></tr>`).join('')}</table><div class="actions"><button class="btn primary" id="gohome">返回學習首頁</button></div>`;$('gohome').onclick=home;}
function start(id){lesson=id;round=topic().items.map((_,i)=>i);advance()}
function advance(){let l=topic();let todo=l.items.map((_,i)=>i).filter(i=>!rec(lesson,i).correct);if(todo.length===0){complete();return}index=todo[0];bank=shuffle(tokens(l.items[index][0]).map((_,i)=>i));placed=[];status='';feedbackInfo=null;stage='play';render()}
function tile(id,where){let word=tokens(topic().items[index][0])[id];return `<button class="tile ${where==='placed'?'placed':''}" draggable="true" data-id="${id}" title="點選或拖曳">${esc(word)}</button>`}
function render(){stage='play';header();let l=topic(),st=stats(lesson),item=l.items[index],r=rec(lesson,index),done=st.done;
$('app').innerHTML=`<div class="statline"><span class="tiny">📖 ${esc(l.title)} · 第 ${index+1}/${l.items.length} 句</span><span class="tiny">⭐ ${total()} 分 · ✅ 已完成 ${done}/${l.items.length}</span></div><div class="progress"><div style="width:${done/l.items.length*100}%"></div></div><div class="prompt"><small>看中文，把英文拼出來</small><h2>${esc(item[1])}</h2><p>💡 句號、逗號和英文單字放在一起</p></div><div class="sectionlabel">✏️ 我的句子</div><div class="zone ${placed.length?'':'empty'}" id="answer-zone">${placed.map(i=>tile(i,'placed')).join('')}</div><div class="sectionlabel">🧩 單字磚塊</div><div class="bank" id="bank-zone">${bank.filter(i=>!placed.includes(i)).map(i=>tile(i,'bank')).join('')}</div><div class="actions"><button class="btn primary" id="check" ${status||placed.length!==bank.length?'disabled':''}>✅ 檢查答案</button><button class="btn secondary" id="reset">🔀 重新排列</button><button class="btn secondary" id="back">🏠 回首頁</button></div><div id="feedback"></div><p class="smallnote">同一句首次答對才獲得積分，答錯後可以一直練到正確。</p>`;
$('check').onclick=check;$('reset').onclick=()=>{placed=[];bank=shuffle(tokens(item[0]).map((_,i)=>i));status='';render()};$('back').onclick=home;
document.querySelectorAll('.tile').forEach(t=>{t.onclick=()=>{if(status)return;let n=+t.dataset.id;placed=placed.includes(n)?placed.filter(v=>v!==n):[...placed,n];render()};t.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',t.dataset.id)})});
for(let z of [$('answer-zone'),$('bank-zone')]){z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();if(status)return;let n=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(n)||n<0||n>=bank.length)return;placed=placed.filter(x=>x!==n);if(z.id==='answer-zone'){let target=e.target.closest('.tile');let at=target?placed.indexOf(+target.dataset.id):-1;if(at<0)placed.push(n);else placed.splice(at,0,n)}render()}}if(status)feedback();}
function check(){if(status||placed.length!==bank.length)return;let r=rec(lesson,index),right=placed.every((id,i)=>id===i);r.attempts++;if(right){if(!r.correct){r.points=r.attempts===1?3:r.attempts===2?2:1;r.correct=true}status='right';party()}else{r.wrong=true;status='wrong'}save();render()}
function feedback(){let ws=tokens(topic().items[index][0]);let right=status==='right';let aligned=ws.map((w,i)=>`<span class="${!right&&placed[i]!==i?'bad':''}">${esc(w)}</span>`).join(' ');$('feedback').innerHTML=right?`<div class="feedback good"><h3>🐱🎉 答對了！太棒了！</h3><div class="answer">${aligned}</div><p>這句獲得 ⭐ ${rec(lesson,index).points} 分！</p><button class="btn mint" id="continue">繼續挑戰下一句 →</button></div>`:`<div class="feedback"><h3>🐾 有些位置還需要調整，加油！</h3><p>紅色的部分是你這次排錯的位置：</p><div class="answer">${aligned}</div><p class="muted">讀完正確句子，再打亂重新拼一次。</p><button class="btn primary" id="repeat">🔁 再試一次</button></div>`;if(right){$('continue').onclick=advance}else{$('repeat').onclick=()=>{bank=shuffle(ws.map((_,i)=>i));placed=[];status='';render()}}}
function complete(){stage='complete';header();if(!me().bonuses)me().bonuses={};let bonus=!me().bonuses[lesson];if(bonus){me().bonuses[lesson]=true;save()}let loc=LESSONS.findIndex(x=>x.id===lesson),next=LESSONS[loc+1];$('app').innerHTML=`<div class="completion"><div class="completion-cat" aria-label="小貓慶祝">😻🎊</div><h1>恭喜單字大過關！</h1><h2>${esc(topic().title)}</h2><p>所有 ${topic().items.length} 句都答對了，錯題也已補練完成！</p><div class="scoreboard"><div class="scorebox"><b>⭐ ${stats(lesson).points}</b><small>本單字句子積分</small></div><div class="scorebox"><b>${bonus?'+5':'已領取'}</b><small>單字完成獎勵</small></div><div class="scorebox"><b>⭐ ${total()}</b><small>總積分</small></div></div><div class="nextcard">${next?`🐱 休息一下，我們要去挑戰 <strong>${esc(next.title)}</strong> 囉！`:'🏆 Unit 05 全部主題練習完成！'}</div><button class="btn primary" id="next-lesson">${next?'▶ 進入下一個單字':'🏠 回到學習首頁'}</button><button class="btn secondary" id="home">學習首頁</button></div>`;party();$('next-lesson').onclick=()=>next?start(next.id):home();$('home').onclick=home;if(next){const completedLesson=lesson;setTimeout(()=>{if(stage==='complete'&&lesson===completedLesson)start(next.id)},5500)}}
home();
</script></body></html>
