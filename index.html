.login-grid{display:grid;gap:13px;max-width:440px;margin:18px auto}.input{width:100%;padding:14px;border:2px solid #f1d7c0;border-radius:14px;font-size:17px}.scoreboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px;margin:18px 0}.scorebox{background:#fdf6e8;border-radius:17px;padding:14px;text-align:center}.scorebox b{font-size:27px;color:#c76f39}.scorebox small{display:block;color:#926f5f}.lesson-card{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff8ec;border:2px solid #f1dfcd;border-radius:18px;padding:15px;margin:12px 0}.lesson-card strong{display:block;color:#755341}.lesson-card small{color:#9b7e66}.completion{text-align:center;padding:30px 8px}.completion-cat{font-size:90px;animation:party .8s ease-in-out infinite}.leader-note{font-size:13px;color:#926f5f;padding:12px;background:#fff7e9;border-radius:12px}.switch{background:none;border:0;color:#94735c;text-decoration:underline}.ranking{width:100%;border-collapse:collapse}.ranking td,.ranking th{padding:11px;border-bottom:1px solid #f5e6d7;text-align:left}.nextcard{background:#effcf5;padding:14px;border-radius:16px;margin:18px 0}.smallnote{font-size:13px;color:#8b766b}.searchbox{padding:15px;background:#f0faf5;border-radius:17px;margin:18px 0}.searchbox label{display:block;font-weight:900;color:#477a67;margin-bottom:8px}.grammar-prompt{background:#eaf7ed;border-color:#a6d9b9}.grammar-options{display:grid;gap:10px}.grammar-option{padding:15px;border:2px solid #b5dfc7;background:#f4fff7;border-radius:15px;text-align:left;font-size:17px;font-weight:800;color:#456958}.grammar-option.correct{border-color:#39aa73;background:#d9f9e5}.grammar-option.incorrect{border-color:#e86b78;background:#ffe5e8}.grammar-option:disabled{opacity:1}
