LESSONS.push(...[{"id":"then","title":"06 then","items":[["Add the milk, and then stir the soup for five minutes.","加入牛奶，接著攪拌湯五分鐘。"],["Mr. Brown was a famous singer then.","布朗先生當時是位知名歌手。"],["The whole system has changed since then.","從那時起整個系統就改變了。"],["We still get together every now and then after all these years.","過了這些年，我們有時還會聚在一起。"],["If you want to lose weight, then you have to eat less.","如果你想減肥，那麼就得少吃一點。"],["In 1941, America’s then president declared war on Japan.","1941 年，當時的美國總統向日本宣戰。"]]},{"id":"about","title":"07 about","items":[["This book is about music.","這是一本有關音樂的書。"],["The bus will leave in about ten minutes.","公車大約再過十分鐘就要開走了。"],["Ron was about ready to leave, but his wife wasn’t.","榮恩幾乎準備好要出發了，但他太太還沒好。"],["The principal is about to arrive.","校長快要到了。"]]},{"id":"find","title":"08 find","items":[["The police still couldn’t find enough evidence.","警方還是無法找到足夠的證據。"],["You have to find out the answer by yourself.","你必須自己找出答案。"],["Cory found the TV show interesting.","柯瑞認為這檔電視節目很有趣。"],["Harry’s new home is great—it’s a real find!","哈利的新家真棒——能找到這種住所真不錯！"]]},{"id":"way","title":"09 way","items":[["I ran into Jenny on my way to the post office.","我去郵局的途中遇見了珍妮。"],["Keep on trying. Let nothing stand in your way.","繼續努力。別讓任何困難阻礙你。"],["Ted didn’t know which way to go.","泰德不知道要走哪邊。"],["We tried to think of some ways to fix the problem.","我們設法想出幾個辦法來解決這個問題。"],["You need to get used to the way he talks.","你得要習慣他的說話風格。"],["What you said is right in a way.","你所說的話就某方面而言是對的。"]]},{"id":"even","title":"10 even","items":[["We’re not friends; I don’t even know his name.","我們不是朋友；我甚至連他的名字都不知道。"],["I’ll give you the money even if you can’t pay me back.","即使你沒能力還錢，我還是會給你錢。"],["Even though he is poor, she still loves him.","雖然他窮，她仍愛他。"],["Gordy thought he had an even chance of winning.","高迪認為自己也有同等獲勝的機會。"],["The floor was not even, and I almost fell.","這地面不平，我差點跌倒。"],["Even numbers can be divided exactly by 2.","偶數可被 2 整除。"],["With the goal, Ben evened the game at 3-3.","班射門得分，讓比 s playing with a live mouse.","這隻貓正在玩一隻活生生的老鼠。"],["We went to see a live band last night.","昨晚我們去看了現場樂團的表演。"]]},{"id":"just","title":"17 just","items":[["I just saw Eric leave the office.","我剛才看到艾瑞克離開辦公室。"],["Amanda came just as I was leaving.","我正好要離開時，亞曼達就來了。"],["I’m just looking; I don’t want to buy anything today.","我只是看一看，今天不想買東西。"],["The weather is just marvelous.","天氣真是非常棒。"],["Just a minute. I’ll be right back.","請等一下，我馬上就回來。"],["We all think that the judge made a just decision.","我們都認為這名法官做了一個公正的決定。"]]},{"id":"between","title":"18 between","items":[["The post office is between the bank and the grocery store.","郵局位在銀行和雜貨店的中間。"],["We have two meetings this afternoon, with a break in between.","我們下午有兩場會議，中間會休息一次。"]]},{"id":"still","title":"19 still","items":[["I’ve eaten five hamburgers, but I’m still hungry.","我已經吃了五個漢堡，但還是很餓。"],["Although Kate got good grades, her parents asked her to study still harder.","雖然凱特成績很好，她父母叫她還要更努力。"],["Keep still while I take your picture.","我幫你拍照時，請保持不動。"]]},{"id":"another","title":"20 another","items":[["Ted ordered another drink for himself.","泰德為自己再點了一杯飲料。"],["I just watched a film, and I’ll probably watch another.","我剛看完一部電影，有可能會再看一部。"],["They gave one another presents at Christmas.","他們在聖誕節期間彼此互送禮物。"]]},{"id":"work","title":"21 work / worker / coworker","items":[["My grandmother used to work for a publisher.","我奶奶曾替一間出版社工作。"],["The machine doesn’t work.","這機器故障了無法運作。"],["I’m glad this method works!","我很高興這個方法行得通！"],["They teamed up and worked out the problem.","他們合作解決了這個問題。"],["Vanessa is looking for work now.","凡妮莎正在找工作。"],["The artist’s works are on display at the gallery.","這名藝術家的作品正在藝廊展出。"],["There are thousands of workers in the factory.","工廠裡有數千名工人。"],["Terry gets along well with his coworkers.","泰瑞跟同事們處得很好。"]]},{"id":"well","title":"22 well","items":[["If you do your duties well, you’ll be rewarded.","如果好好盡你的職責，你就會得到獎賞。"],["I don’t feel well today, so I’ll call in sick.","我今天身體不舒服，所以我會打電話請病假。"],["The oil well has gon const KEY='kitten-academy-local-v2';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tokens=s=>s.trim().split(/\s+/);
let db={users:{},active:null};try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');if(d&&d.users)db=d}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}};
let lesson=null,index=0,bank=[],placed=[],status='',stage='home',round=[],feedbackInfo=null,grammarSeen={};
const me=()=>db.users[db.active];
const topic=()=>LESSONS.find(l=>l.id===lesson);
const rec=(lid,i)=>{let u=me();u.progress??={};u.progress[lid]??={};u.progress[lid][i]??={attempts:0,correct:false,points:0,wrong:false};return u.progress[lid][i]};
const stats=lid=>{let l=LESSONS.find(x=>x.id===lid),u=me();let records=(u?.progress||{})[lid]||{};return {done:l.items.filter((_,i)=>records[i]?.correct).length,total:l.items.length,points:Object.values(records).reduce((n,r)=>n+(r.points||0),0),complete:l.items.every((_,i)=>records[i]?.correct)};};
const total=()=>Object.values(me().progress||{}).flatMap(x=>Object.values(x)).reduce((a,r)=>a+(r.points||0),0)+Object.keys(me().bonuses||{}).length*5;
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}if(a.length>1&&a.every((x,i)=>x===i))[a[0],a[1]]=[a[1],a[0]];return a}
function party(){let c=$('cat');c.classList.add('party');setTimeout(()=>c?.classList.remove('party'),2200);for(let i=0;i<23;i++){let s=document.createElement('span');s.className='sparkle';s.textContent=['🌟','💗','✨','🐾','🎉'][i%5];s.style.left=(15+Math.random()*70)+'vw';s.style.top=(15+Math.random()*40)+'vh';s.style.setProperty('--dx',(Math.random()*240-120)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1500)}}
function header(){let nav=$('tabs');nav.innerHTML=db.active?`<button class="tab ${stage==='home'?'active':''}" data-page="home">🏠 學習首頁</button><button class="tab ${stage==='ranking'?'active':''}" data-page="ranking">🏆 排行榜</button><button class="tab" data-page="logout">👋 切換學員</button>`:'';nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.page==='logout'){db.active=null;save();stage='home';home()}else if(b.dataset.page==='ranking')ranking();else home()});}
function home(){stage='home';header();if(!me()){$('app').innerHTML=`<div class="homecard" style="text-align:center"><h2>🐱 歡迎來到喵喵英文學院！</h2><p>先輸入學員暱稱，就可以開始練習與累積星星。</p></div><div class="login-grid"><label>學員暱稱<input id="nickname" class="input" maxlength="20" autocomplete="nickname" placeholder="例如：小喵、Amy"></label><button class="btn primary" id="enter">🐾 開始學習</button><div class="leader-note">目前是單機體驗版：使用暱稱建立這台手機上的學習檔案，<strong>不是雲端帳號或密碼登入</strong>。跨裝置帳號與朋友排行榜需連接安全資料庫，請勿在此輸入密碼。</div></div>`;$('enter').onclick=()=>{let n=$('nickname').value.trim();if(!n){alert('先輸入暱稱喔！');return}if(!db.users[n])db.users[n]={progress:{},bonuses:{}};db.active=n;save();home()};return}
let completed=LESSONS.filter(l=>stats(l.id).complete).length;
$('app').innerHTML=`<h2>🐾 ${esc(db.active)}，歡迎回來！</h2><div class="scoreboard"><div class="scorebox"><b>⭐ ${total()}</b><small>累積積分</small></div><div class="scorebox"><b>${completed} / ${LESSONS.length}</b><small>完成單字</small></div></div><p class="smallnote">第一次答對 3 分、第二次答對 2 分、第三次以後答對 1 分；每個句子只計分一次。完成一整個單字再加 5 分。</p><div class="searchbox"><label for="searchword">🔎 搜尋單字或例句</label><input class="input" id="searchword" type="search" placeholder="輸入單字，例如：between、take、因為" autocomplete="off"><div class="smallnote" id="search-count"></div></div><div id="lesson-list">${LESSONS.map(l=>{let st=stats(l.id);return `<div class="lesson-card"><div><strong>${esc(l.title)}</strong><small>✅ ${st.done}/${st.total} 句 · ⭐ ${st.points} 分${st.complete?' · 已過關 🏅':''}</small></div><button class="btn ${st.complete?'secondary':'primary'}" data-start="${l.id}">${st.complete?'再次複習':'開始練習 →'}</button></div>`}).join('')}</div><div class="leader-note">🏆 想跟不同手機上的朋友比較排名？目前仍需啟用雲端帳號和資料庫，這個版本不會顯示虛構的朋友排名。</div>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));let search=$('searchword');if(search){search.oninput=()=>{let q=search.value.trim().toLowerCase();let rows=[...document.querySelectorAll('#lesson-list .lesson-card')];let visible=0;rows.forEach((row,i)=>{let l=LESSONS[i];let show=!q||l.title.toLowerCase().includes(q)||l.items.some(a=>a.join(' ').toLowerCase().includes(q));row.classList.toggle('hidden',!show);if(show)visible++});$('search-count').textContent=q?`符合 ${visible} 個單字主題`:''}};}
function ranking(){stage='ranking';header();let people=Object.entries(db.users).map(([name,u])=>({name,score:Object.values(u.progress||{}).flatMap(x=>Object.values(x)).reduce((a,r)=>a+(r.points||0),0)+Object.keys(u.bonuses||{}).length*5})).sort((a,b)=>b.score-a.score).slice(0,10);$('app').innerHTML=`<h2>🏆 本裝置積分榜</h2><p class="leader-note">這裡只會列出<strong>同一瀏覽器中建立的學員</strong>，不是網路朋友的即時排行榜。雲端前十名功能尚待串接。</p><table class="ranking"><tr><th>排名</th><th>暱稱</th><th>積分</th></tr>${people.map((u,i)=>`<tr><td>${i<3?['🥇','🥈','🥉'][i]:'#'+(i+1)}</td><td>${esc(u.name)}</td><td>⭐ ${u.score}</td></tr>`).join('')}</table><div class="actions"><button class="btn primary" id="gohome">返回學習首頁</button></div>`;$('gohome').onclick=home;}
function start(id){lesson=id;round=topic().items.map((_,i)=>i);grammarSeen={};advance()}
function advance(){let l=topic();let todo=l.items.map((_,i)=>i).filter(i=>!rec(lesson,i).correct);if(todo.length===0){complete();return}index=todo[0];bank=shuffle(tokens(l.items[index][0]).map((_,i)=>i));placed=[];status='';feedbackInfo=null;stage='play';render()}
function tile(id,where){let word=tokens(topic().items[index][0])[id];return `<button class="tile ${where==='placed'?'placed':''}" draggable="true" data-id="${id}" title="點選或拖曳">${esc(word)}</button>`}
function render(){stage='play';header();let l=topic(),st=stats(lesson),item=l.items[index],r=rec(lesson,index),done=st.done;
$('app').innerHTML=`<div class="statline"><span class="tiny">📖 ${esc(l.title)} · 第 ${index+1}/${l.items.length} 句</span><span class="tiny">⭐ ${total()} 分 · ✅ 已完成 ${done}/${l.items.length}</span></div><div class="progress"><div style="width:${done/l.items.length*100}%"></div></div><div class="prompt"><small>看中文，把英文拼出來</small><h2>${esc(item[1])}</h2><p>💡 句號、逗號和英文單字放在一起</p></div><div class="sectionlabel">✏️ 我的句子</div><div class="zone ${placed.length?'':'empty'}" id="answer-zone">${placed.map(i=>tile(i,'placed')).join('')}</div><div class="sectionlabel">🧩 單字磚塊</div><div class="bank" id="bank-zone">${bank.filter(i=>!placed.includes(i)).map(i=>tile(i,'bank')).join('')}</div><div class="actions"><button class="btn primary" id="check" ${status||placed.length!==bank.length?'disabled':''}>✅ 檢查答案</button><button class="btn secondary" id="reset">🔀 重新排列</button><button class="btn secondary" id="back">🏠 回首頁</button></div><div id="feedback"></div><p class="smallnote">同一句首次答對才獲得積分，答錯後可以一直練到正確。</p>`;
$('check').onclick=check;$('reset').onclick=()=>{placed=[];bank=shuffle(tokens(item[0]).map((_,i)=>i));status='';render()};$('back').onclick=home;
document.querySelectorAll('.tile').forEach(t=>{t.onclick=()=>{if(status)return;let n=+t.dataset.id;placed=placed.includes(n)?placed.filter(v=>v!==n):[...placed,n];render()};t.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',t.dataset.id)})});
for(let z of [$('answer-zone'),$('bank-zone')]){z.ondragover=e=>e.preventDefault();z.ondrop=e=>{e.preventDefault();if(status)return;let n=Number(e.dataTransfer.getData('text/plain'));if(!Number.isInteger(n)||n<0||n>=bank.length)return;placed=placed.filter(x=>x!==n);if(z.id==='answer-zone'){let target=e.target.closest('.tile');let at=target?placed.indexOf(+target.dataset.id):-1;if(at<0)placed.push(n);else placed.splice(at,0,n)}render()}}if(status)feedback();}
function check(){if(status||placed.length!==bank.length)return;let r=rec(lesson,index),right=placed.every((id,i)=>id===i);r.attempts++;if(right){if(!r.correct){r.points=r.attempts===1?3:r.attempts===2?2:1;r.correct=true}status='right';party()}else{r.wrong=true;status='wrong'}save();render()}
function feedback(){let ws=tokens(topic().items[index][0]);let right=status==='right';let aligned=ws.map((w,i)=>`<span class="${!right&&placed[i]!==i?'bad':''}">${esc(w)}</span>`).join(' ');$('feedback').innerHTML=right?`<div class="feedback good"><h3>🐱🎉 答對了！太棒了！</h3><div class="answer">${aligned}</div><p>這句獲得 ⭐ ${rec(lesson,index).points} 分！</p><button class="btn mint" id="continue">繼續挑戰下一句 →</button></div>`:`<div class="feedback"><h3>🐾 有些位置還需要調整，加油！</h3><p>紅色的部分是你這次排錯的位置：</p><div class="answer">${aligned}</div><p class="muted">讀完正確句子，再打亂重新拼一次。</p><button class="btn primary" id="repeat">🔁 再試一次</button></div>`;if(right){$('continue').onclick=()=>{let completed=stats(lesson).done;if(completed>0&&completed%3===0&&!grammarSeen[lesson+':'+completed]){grammarSeen[lesson+':'+completed]=true;grammarQuiz();}else advance()}}else{$('repeat').onclick=()=>{bank=shuffle(ws.map((_,i)=>i));placed=[];status='';render()}}}
function grammarQuiz(){stage='grammar';header();let questions=GRAMMAR[lesson]||[],q=questions[0];if(!q){advance();return}let [prompt,choices,right,explain]=q;$('app').innerHTML=`<div class="statline"><span class="tiny">🌱 文法重點比較 · ${esc(topic().title)}</span><span class="tiny">不計額外積分</span></div><div class="prompt grammar-prompt"><small>穿插練習：選出最正確的用法</small><h2>${esc(prompt)}</h2></div><div class="grammar-options">${choices.map((c,i)=>`<button class="grammar-option" data-choice="${i}">${esc(c)}</button>`).join('')}</div><div id="grammar-feedback"></div><div class="actions"><button class="btn secondary" id="grammar-skip">略過文法題，繼續拼句</button></div>`;let buttons=[...document.querySelectorAll('[data-choice]')];buttons.forEach(b=>b.onclick=()=>{buttons.forEach(x=>{x.disabled=true;x.classList.toggle('correct',+x.dataset.choice===right);x.classList.toggle('incorrect',x===b&&+x.dataset.choice!==right)});let good=+b.dataset.choice===right;$('grammar-feedback').innerHTML=`<div class="feedback ${good?'good':''}"><h3>${good?'🐱 文法正確！':'🐾 差一點！記住這個重點'}</h3><p>${esc(explain)}</p><button class="btn mint" id="grammar-next">繼續拼句 →</button></div>`;$('grammar-next').onclick=advance});$('grammar-skip').onclick=advance}
function complete(){stage='complete';header();if(!me().bonuses)me().bonuses={};let bonus=!me().bonuses[lesson];if(bonus){me().bonuses[lesson]=true;save()}let loc=LESSONS.findIndex(x=>x.id===lesson),next=LESSONS[loc+1];$('app').innerHTML=`<div class="completion"><div class="completion-cat" aria-label="小貓慶祝">😻🎊</div><h1>恭喜單字大過關！</h1><h2>${esc(topic().title)}</h2><p>所有 ${topic().items.length} 句都答對了，錯題也已補練完成！</p><div class="scoreboard"><div class="scorebox"><b>⭐ ${stats(lesson).points}</b><small>本單字句子積分</small></div><div class="scorebox"><b>${bonus?'+5':'已領取'}</b><small>單字完成獎勵</small></div><div class="scorebox"><b>⭐ ${total()}</b><small>總積分</small></div></div><div class="nextcard">${next?`🐱 休息一下，我們要去挑戰 <strong>${esc(next.title)}</strong> 囉！`:'🏆 Unit 05 全部主題練習完成！'}</div><button class="btn primary" id="next-lesson">${next?'▶ 進入下一個單字':'🏠 回到學習首頁'}</button><button class="btn secondary" id="home">學習首頁</button></div>`;party();$('next-lesson').onclick=()=>next?start(next.id):home();$('home').onclick=home;if(next){const completedLesson=lesson;setTimeout(()=>{if(stage==='complete'&&lesson===completedLesson)start(next.id)},5500)}}
home();
</script></body></html>
