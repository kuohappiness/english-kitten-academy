name: 檢查題庫格式
on:
  push:
    paths: ['lessons/**', 'tools/validate-lessons.js']
  pull_request:
    paths: ['lessons/**', 'tools/validate-lessons.js']
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/validate-lessons.js
